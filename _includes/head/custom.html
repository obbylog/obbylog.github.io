<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#17212b">

<!-- Google AdSense -->
<meta name="google-adsense-account" content="ca-pub-3775167311633597">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3775167311633597"
     crossorigin="anonymous"></script>

<!-- Google tag (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NT07B4KWRE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NT07B4KWRE', {
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
</script>

<!-- 트위터(X) 큰 이미지 미리보기. 제목·설명·이미지는 og 태그를 그대로 씀 -->
<meta name="twitter:card" content="summary_large_image">

{% if page.collection == "posts" %}
{% assign ld_image = page.header.og_image | default: page.header.teaser | default: site.og_image %}
<!-- 글 구조 데이터 (BlogPosting) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip | jsonify }},
  "image": [{{ ld_image | absolute_url | jsonify }}],
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "inLanguage": "ko-KR",
  "author": { "@type": "Organization", "name": "옵비로그", "url": "{{ '/about/' | absolute_url }}" },
  "publisher": {
    "@type": "Organization",
    "name": "옵비로그",
    "logo": { "@type": "ImageObject", "url": "{{ '/assets/images/og-default.png' | absolute_url }}" }
  },
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ page.url | absolute_url | jsonify }} },
  "keywords": {{ page.tags | join: ", " | jsonify }}
}
</script>
{% endif %}
